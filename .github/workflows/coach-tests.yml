name: Coach regressions

on:
  pull_request:
    paths: ['coach/**', '.github/workflows/coach-tests.yml']
  push:
    branches: [main]
    paths: ['coach/**', '.github/workflows/coach-tests.yml']

jobs:
  coach-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s coach/tests -v
      - run: python -m py_compile coach/*.py
